services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      ATLAS_POSTGRES_SUPERUSER_PASSWORD: null
      ATLAS_WORKER_DATABASE_URL: null
      ATLAS_WORKER_HANDLERS_MODULE: null
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "${ATLAS_INBOX_CONTENT_PATH:?Mount the reviewed inbox content module directory}:/app/apps/inbox-content:ro"
      - "${ATLAS_WEBHOOK_SECRETS_PATH:?Mount the reviewed webhook secret module directory}:/app/apps/webhook-secrets:ro"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: "${ATLAS_POSTGRES_SUPERUSER_PASSWORD:?Set ATLAS_POSTGRES_SUPERUSER_PASSWORD in the deployment environment}"
    volumes:
      - atlas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - atlas-redis:/data
  control-plane:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "apps/worker/control-plane.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ATLAS_DATABASE_URL: "${ATLAS_WORKER_DATABASE_URL:?Set a restricted atlas_worker database URL}"
      ATLAS_WORKER_DATABASE_URL: "${ATLAS_WORKER_DATABASE_URL:?Set a restricted atlas_worker database URL}"
      ATLAS_DATABASE_SSL_CA_FILE: "${ATLAS_DATABASE_SSL_CA_FILE:-}"
      ATLAS_WORKER_SECRET_RESOLVER_MODULE: "${ATLAS_WORKER_SECRET_RESOLVER_MODULE:?Set the reviewed secret resolver module}"
      ATLAS_RUNTIME_POOL_ID: "${ATLAS_RUNTIME_POOL_ID:?Set ATLAS_RUNTIME_POOL_ID}"
      ATLAS_WORKER_ID: "${ATLAS_WORKER_ID:-control}"
      ATLAS_AUTOSCALER_ENABLED: "${ATLAS_AUTOSCALER_ENABLED:-false}"
      ATLAS_AUTOSCALER_ACTUATOR_URL: "${ATLAS_AUTOSCALER_ACTUATOR_URL:-}"
      ATLAS_AUTOSCALER_ACTUATOR_SECRET_REF: "${ATLAS_AUTOSCALER_ACTUATOR_SECRET_REF:-}"
      ATLAS_AUTOSCALER_LEASE_SECONDS: "${ATLAS_AUTOSCALER_LEASE_SECONDS:-60}"
      ATLAS_AUTOSCALER_INTERVAL_MS: "${ATLAS_AUTOSCALER_INTERVAL_MS:-30000}"
      ATLAS_AUTOSCALER_TIMEOUT_MS: "${ATLAS_AUTOSCALER_TIMEOUT_MS:-5000}"
      ATLAS_ALERT_ROUTER_ENABLED: "${ATLAS_ALERT_ROUTER_ENABLED:-false}"
      ATLAS_OTLP_ENDPOINT: "${ATLAS_OTLP_ENDPOINT:-}"
      ATLAS_OTLP_AUTH_SECRET_REF: "${ATLAS_OTLP_AUTH_SECRET_REF:-}"
      ATLAS_OTLP_TIMEOUT_MS: "${ATLAS_OTLP_TIMEOUT_MS:-3000}"
      ATLAS_POSTGRES_SUPERUSER_PASSWORD: null
    volumes:
      - "${ATLAS_WORKER_SECRETS_PATH:?Mount a reviewed secret resolver directory}:/app/apps/worker/secrets:ro"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "apps/worker/main.mjs"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ATLAS_DATABASE_URL: "${ATLAS_WORKER_DATABASE_URL:?Set a restricted atlas_worker database URL}"
      ATLAS_WORKER_DATABASE_URL: "${ATLAS_WORKER_DATABASE_URL:?Set a restricted atlas_worker database URL}"
      ATLAS_DATABASE_SSL_CA_FILE: "${ATLAS_DATABASE_SSL_CA_FILE:-}"
      ATLAS_WORKER_HANDLERS_MODULE: v125-production.mjs
      ATLAS_WORKER_SECRET_RESOLVER_MODULE: "${ATLAS_WORKER_SECRET_RESOLVER_MODULE:?Set the reviewed secret resolver module}"
      ATLAS_INBOX_CONTENT_MODULE: "${ATLAS_INBOX_CONTENT_MODULE:?Set the reviewed inbox content module}"
      ATLAS_WEBHOOK_SECRET_RESOLVER_MODULE: "${ATLAS_WEBHOOK_SECRET_RESOLVER_MODULE:?Set the reviewed webhook secret resolver module}"
      ATLAS_WORKER_CONCURRENCY: "${ATLAS_WORKER_CONCURRENCY:-4}"
      ATLAS_WORKER_LEASE_SECONDS: "${ATLAS_WORKER_LEASE_SECONDS:-60}"
      ATLAS_WORKER_POLL_MS: "${ATLAS_WORKER_POLL_MS:-1000}"
      ATLAS_RUNTIME_POOL_ID: "${ATLAS_RUNTIME_POOL_ID:-}"
      ATLAS_SLO_EVALUATION_INTERVAL_MS: "${ATLAS_SLO_EVALUATION_INTERVAL_MS:-30000}"
      ATLAS_REDIS_URL: "${ATLAS_REDIS_URL:-}"
      ATLAS_REDIS_NAMESPACE: "${ATLAS_REDIS_NAMESPACE:-atlas}"
      ATLAS_REDIS_CONNECT_TIMEOUT_MS: "${ATLAS_REDIS_CONNECT_TIMEOUT_MS:-3000}"
      ATLAS_RUNTIME_CONTROL_EVENTS_ENABLED: "${ATLAS_RUNTIME_CONTROL_EVENTS_ENABLED:-false}"
      ATLAS_OTLP_ENDPOINT: "${ATLAS_OTLP_ENDPOINT:-}"
      ATLAS_OTLP_AUTH_SECRET_REF: "${ATLAS_OTLP_AUTH_SECRET_REF:-}"
      ATLAS_OTLP_TIMEOUT_MS: "${ATLAS_OTLP_TIMEOUT_MS:-3000}"
      ATLAS_POSTGRES_SUPERUSER_PASSWORD: null
    volumes:
      - "${ATLAS_WORKER_SECRETS_PATH:?Mount a reviewed local secret resolver directory}:/app/apps/worker/secrets:ro"
      - "${ATLAS_INBOX_CONTENT_PATH:?Mount the reviewed inbox content module directory}:/app/apps/inbox-content:ro"
      - "${ATLAS_WEBHOOK_SECRETS_PATH:?Mount the reviewed webhook secret module directory}:/app/apps/webhook-secrets:ro"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  atlas-postgres:
  atlas-redis:
