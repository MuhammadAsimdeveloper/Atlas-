name: Atlas CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run doctor
      - run: npm run mirofish:check
      - run: npm run docs:check
      - run: npm run seo:check
      - run: npm run build:site
      - run: npm run smoke:e2e
      - run: npm run launch:check
      - run: npm run production:check
      - run: npm run production:activation-check
      - name: Build production container
        run: docker build -t atlas-ci:${{ github.sha }} .
      - run: npm audit --audit-level=moderate
      - name: Upload launch-safe preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-v145-static-preview-node-${{ matrix.node }}
          path: dist/atlas-site
          if-no-files-found: error
          retention-days: 14
